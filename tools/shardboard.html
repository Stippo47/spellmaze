<!doctype html>
<meta charset="utf-8">
<title>Shard looks</title>
<!-- Round 5: shards got PROBLEM, so a board of other looks for the module pickup. node tools/shardboard.mjs -->
<body style="margin:0;background:#04060c">
<div id="out"></div>
<script>
const S = 48, Wd = 6, F = { floor: '#0d1326', line: '#1a2340', wall: '#262c5e', edge: '#5a63c4' };
const GOLD = '#ffc23a', GDARK = '#c98a00', GLITE = '#fff1c4';
function scene(draw) {
  const c = document.createElement('canvas'); c.width = c.height = S * Wd; const x = c.getContext('2d');
  x.fillStyle = F.floor; x.fillRect(0, 0, c.width, c.height);
  x.strokeStyle = F.line; x.lineWidth = 2; x.beginPath();
  for (let i = 0; i <= Wd; i++) { x.moveTo(i * S, 0); x.lineTo(i * S, c.height); x.moveTo(0, i * S); x.lineTo(c.width, i * S); } x.stroke();
  x.fillStyle = F.wall; x.fillRect(0, 0, c.width, S * 0.9); x.fillStyle = F.edge; x.fillRect(0, S * 0.9 - 8, c.width, 8);
  x.save(); x.translate(c.width / 2, c.height / 2 + S * 0.3); x.scale(S, S); draw(x); x.restore();
  return c;
}
const poly = (x, pts, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) x.lineTo(pts[i], pts[i + 1]); x.closePath(); x.fill(); };
const shadow = (x, w = 0.8) => { x.fillStyle = 'rgba(0,0,0,0.35)'; x.beginPath(); x.ellipse(0, 1.0, w, 0.25, 0, 0, 7); x.fill(); };
const crystal = (x, a, b, c) => { poly(x, [0, -1.35, 0, 0.95, -0.75, 0], a); poly(x, [0, -1.35, 0.75, 0, 0, 0.95], b); poly(x, [0, -1.35, -0.34, -0.25, 0, -0.1], c); };
const LOOKS = {
  crystal: { label: 'Crystal (now)', text: 'The gold crystal you marked.', draw: (x) => { shadow(x); crystal(x, GOLD, GDARK, GLITE); } },
  rarity: { label: 'Crystal, rarity colour', text: 'Same crystal, coloured by what it holds: white, green, blue, purple, gold.', draw: (x) => {
    const cols = [['#e8f0ff', '#8b94bb'], ['#35f0a0', '#139a62'], ['#3d8bff', '#1c4fa8'], ['#b45cff', '#6a2aa8'], [GOLD, GDARK]];
    cols.forEach(([a, b], i) => { x.save(); x.translate(-1.9 + i * 0.95, 0.1); x.scale(0.55, 0.55); shadow(x); crystal(x, a, b, '#ffffff'); x.restore(); }); } },
  rune: { label: 'Rune circle', text: 'A glowing ring drawn on the floor. Walk onto it.', draw: (x) => {
    x.strokeStyle = GOLD; x.lineWidth = 0.14; x.beginPath(); x.ellipse(0, 0.3, 1.3, 1.3, 0, 0, 7); x.stroke();
    x.lineWidth = 0.08; x.beginPath(); x.ellipse(0, 0.3, 0.95, 0.95, 0, 0, 7); x.stroke();
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; x.save(); x.translate(Math.cos(a) * 1.12, 0.3 + Math.sin(a) * 1.12); x.rotate(a); x.fillStyle = GOLD; x.fillRect(-0.06, -0.14, 0.12, 0.28); x.restore(); }
    poly(x, [0, -0.15, 0.3, 0.3, 0, 0.75, -0.3, 0.3], GOLD); } },
  orb: { label: 'Orb on a stand', text: 'A gold ball resting on a small dark stand.', draw: (x) => {
    shadow(x, 0.9); x.fillStyle = '#2a3360'; x.fillRect(-0.7, 0.35, 1.4, 0.6); x.fillStyle = '#5a63c4'; x.fillRect(-0.7, 0.35, 1.4, 0.14);
    x.fillStyle = GDARK; x.beginPath(); x.arc(0, -0.25, 0.7, 0, 7); x.fill(); x.fillStyle = GOLD; x.beginPath(); x.arc(-0.08, -0.33, 0.58, 0, 7); x.fill();
    x.fillStyle = GLITE; x.beginPath(); x.arc(-0.3, -0.55, 0.16, 0, 7); x.fill(); } },
  tome: { label: 'Spell book', text: 'A closed book with a sigil. Each one is a page of spell.', draw: (x) => {
    shadow(x, 1); x.fillStyle = GDARK; x.fillRect(-0.9, -0.85, 1.8, 1.7); x.fillStyle = GOLD; x.fillRect(-0.75, -0.85, 1.65, 1.6);
    x.fillStyle = '#7a4d00'; x.fillRect(-0.9, -0.85, 0.22, 1.7);
    x.strokeStyle = '#7a4d00'; x.lineWidth = 0.1; x.beginPath(); x.arc(0.08, -0.05, 0.42, 0, 7); x.moveTo(0.08, -0.47); x.lineTo(0.08, 0.37); x.moveTo(-0.34, -0.05); x.lineTo(0.5, -0.05); x.stroke(); } },
  cube: { label: 'Floating cube', text: 'A small cube hovering and turning slowly.', draw: (x) => {
    shadow(x, 0.7); x.translate(0, -0.3);
    poly(x, [0, -0.9, 0.8, -0.45, 0, 0, -0.8, -0.45], GLITE); poly(x, [-0.8, -0.45, 0, 0, 0, 0.9, -0.8, 0.45], GOLD); poly(x, [0.8, -0.45, 0, 0, 0, 0.9, 0.8, 0.45], GDARK); } },
  obelisk: { label: 'Obelisk', text: 'A tall thin stone with a glowing band. Touch it.', draw: (x) => {
    shadow(x, 0.6); poly(x, [-0.45, 0.95, 0.45, 0.95, 0.3, -1.4, 0, -1.75, -0.3, -1.4], '#3a4380'); poly(x, [0, -1.75, 0.3, -1.4, 0.45, 0.95, 0, 0.95], '#2a3360');
    x.fillStyle = GOLD; x.fillRect(-0.38, -0.35, 0.76, 0.28); x.fillRect(-0.06, -1.3, 0.12, 0.7); } },
  plate: { label: 'Glyph plate', text: 'A raised square plate in the floor with a glyph.', draw: (x) => {
    x.fillStyle = '#7a4d00'; x.fillRect(-1.1, -0.6, 2.2, 1.7); x.fillStyle = GDARK; x.fillRect(-1.1, -0.8, 2.2, 1.7); x.fillStyle = GOLD; x.fillRect(-0.95, -0.65, 1.9, 1.4);
    x.strokeStyle = '#7a4d00'; x.lineWidth = 0.12; x.beginPath(); x.moveTo(-0.5, 0.45); x.lineTo(0, -0.45); x.lineTo(0.5, 0.45); x.moveTo(-0.3, 0.05); x.lineTo(0.3, 0.05); x.stroke(); } },
  star: { label: 'Spinning star', text: 'A four-point star turning in the air.', draw: (x) => {
    shadow(x, 0.6); x.translate(0, -0.3); x.rotate(0.3);
    poly(x, [0, -1.2, 0.25, -0.25, 1.2, 0, 0.25, 0.25, 0, 1.2, -0.25, 0.25, -1.2, 0, -0.25, -0.25], GOLD);
    poly(x, [0, -1.2, 0.25, -0.25, 0, 0, -0.25, -0.25], GLITE); poly(x, [0, 1.2, 0.25, 0.25, 0, 0, -0.25, 0.25], GDARK); } },
};
window.LOOKS = Object.fromEntries(Object.entries(LOOKS).map(([k, v]) => [k, { label: v.label, text: v.text }]));
for (const [k, v] of Object.entries(LOOKS)) { const c = scene(v.draw); c.id = k; c.style.display = 'block'; document.getElementById('out').appendChild(c); }
</script>
</body>
